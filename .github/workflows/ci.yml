name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and build
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode on the runner
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          swift --version

      - name: Core tests
        run: swift test

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build app (Release, ad-hoc signed)
        run: |
          xcodegen generate
          xcodebuild -project AgentAlarm.xcodeproj -scheme AgentAlarm -configuration Release \
            -derivedDataPath build/dd CURRENT_PROJECT_VERSION=${{ github.run_number }} build -quiet
          APP=build/dd/Build/Products/Release/AgentAlarm.app
          codesign --verify --deep --strict "$APP"
          "$APP/Contents/Helpers/agentalarm" --version

      - name: Package
        run: |
          SHORT=${GITHUB_SHA::7}
          ditto -c -k --sequesterRsrc --keepParent build/dd/Build/Products/Release/AgentAlarm.app "AgentAlarm-$SHORT.zip"
          shasum -a 256 "AgentAlarm-$SHORT.zip" | tee "AgentAlarm-$SHORT.zip.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgentAlarm-${{ github.sha }}
          path: |
            AgentAlarm-*.zip
            AgentAlarm-*.zip.sha256
          retention-days: 14
